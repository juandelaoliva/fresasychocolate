    alt_en: Ritonka bars and drinking chocolate on a spoon, next to sliced
      strawberries and roses
  - foto: assets/img/insta/ritonka-rosa-primer-plano.webp
    alt: Primer plano de una tableta Ritonka de chocolate con leche y fresa
