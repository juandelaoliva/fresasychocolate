antetitulo: para llevar
antetitulo_en: to take home
titulo: En la tienda
titulo_en: In the shop
intro: Además de lo que preparamos al momento, en la tienda también encontrarás
  chocolates y otros productos. Van cambiando, así que pregunta qué tenemos hoy.
intro_en: Besides what we make on the spot, in the shop you will also find
  chocolates and other products. They change, so ask what we have today.
