descripcion_negocio: Tienda de fresas con chocolate en el centro de Salamanca, a
  pocos pasos de la Plaza Mayor. Vasos de fresas de Salamanca bañadas en
  chocolate belga Callebaut, con cremas y toppings a elegir; también batidos de
  fresa, matcha, café y bandejas de fresas bañadas por encargo.
descripcion_negocio_en: "Chocolate-covered strawberry shop in the centre of Salamanca, a few steps from the Plaza Mayor. Cups of Salamanca strawberries dipped in Belgian Callebaut chocolate, with creams and toppings of your choice; also strawberry shakes, matcha, coffee and made-to-order trays of dipped strawberries."
