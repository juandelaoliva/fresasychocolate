# Genera la web con build.py y la publica en GitHub Pages en cada cambio de main
# (también los que se guardan desde Pages CMS). Si build.py encuentra un error en el
# contenido, falla y sigue publicada la versión anterior.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ffmpeg (para los vídeos subidos desde el móvil)
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
